name: volfied
description: "Volfied — claim the field before the snake monster poisons your trail."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/texts/
    - assets/images/
    - assets/styles/
    - assets/scripts/
    - assets/videos/
    - assets/hooks/
    - assets/fonts/
